<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адміністрування забігу - Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }
        .login-form {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="login-form">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center py-3">
                <h1 class="h4 mb-0">Адміністрування забігу</h1>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                </div>
                {% endif %}
                
                <form method="post" action="{{ url_for('admin_login') }}">
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль адміністратора</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required autofocus>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Увійти
                        </button>
                        <a href="{{ url_for('public_home') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-2"></i> Повернутися на головну
                        </a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center text-muted py-3">
                Благодійний Забіг УКУ
            </div>
        </div>
    </div>
</body>
</html>
