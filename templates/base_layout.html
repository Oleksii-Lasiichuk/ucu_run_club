<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Благодійний Забіг{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Благодійний Забіг УКУ</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% block home_active %}{% endblock %}" href="/">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block rankings_active %}{% endblock %}" href="/rankings">Рейтинг учасників</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block find_me_active %}{% endblock %}" href="/find-me">Знайти себе</a>
                    </li>
                </ul>
                <div class="d-flex">
                    {% if session.get('is_admin') %}
                        <a href="/admin" class="btn btn-success me-2">Адмін-панель</a>
                        <a href="/admin/logout" class="btn btn-outline-light">Вийти</a>
                    {% else %}
                        <a href="/admin/login" class="btn btn-outline-light">Адміністрування</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">Благодійний Забіг УКУ © 2025</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.0.0/dist/chart.umd.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
